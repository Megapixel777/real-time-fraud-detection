[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.0.0"
description = "Real-Time Fraud Detection Platform 2.0"
requires-python = ">=3.12"

dependencies = [
    "pyspark>=4.0,<5.0",
    "kafka-python",
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "scikit-learn",
    "pydantic",
    "psycopg[binary]",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"